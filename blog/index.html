<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog — George Bisbas</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230d1117'/%3E%3Ctext x='50' y='70' font-family='monospace' font-size='58' fill='%2339c5cf' text-anchor='middle'%3E%3E_%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #0d1117;
            --text: #e6edf3;
            --text-muted: #8b949e;
            --accent: #39c5cf;
            --border: #21262d;
            --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
            --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        body {
            font-family: var(--sans);
            line-height: 1.65;
            margin: 0;
            background: var(--bg);
            color: var(--text);
        }
        .page {
            max-width: 720px;
            margin: 0 auto;
            padding: 48px 20px;
        }
        a {
            color: var(--accent);
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        h1 {
            font-family: var(--mono);
            letter-spacing: -0.01em;
        }
        .nav-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 1.5em;
        }
        .nav-btn {
            display: inline-block;
            font-family: var(--mono);
            font-size: 0.82em;
            padding: 5px 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: rgba(57, 197, 207, 0.12);
            color: var(--accent);
        }
        .nav-btn:hover {
            background: rgba(57, 197, 207, 0.22);
            text-decoration: none;
        }
        ul.post-list {
            list-style: none;
            padding: 0;
            margin-top: 2em;
        }
        ul.post-list li {
            border-top: 1px solid var(--border);
            padding: 1em 0;
        }
        ul.post-list li:last-child {
            border-bottom: 1px solid var(--border);
        }
        .post-title {
            font-family: var(--mono);
            font-size: 1.05em;
        }
        .post-date {
            display: block;
            font-size: 0.8em;
            color: var(--text-muted);
            margin-top: 0.3em;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="nav-actions">
            <a class="nav-btn" href="../index.html">&larr; Homepage</a>
        </div>
        <h1>Blog</h1>
        <ul class="post-list">
            <li>
                <a class="post-title" href="temporal-blocking-ipdps21.html">Temporal blocking with sparse off-the-grid sources — figure plate</a>
                <span class="post-date">2026</span>
            </li>
        </ul>
    </div>
</body>
</html>
